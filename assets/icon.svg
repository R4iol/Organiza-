<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ícone do Aplicativo PWA IFAP">
  <defs>
    <linearGradient id="fundoGradiente" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
  </defs>

  <!-- Fundo arredondado no padrão de ícone de aplicativo -->
  <rect width="512" height="512" rx="112" fill="url(#fundoGradiente)" />

  <!-- Círculo decorativo sutil ao fundo -->
  <circle cx="408" cy="112" r="88" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="104" cy="416" r="112" fill="#ffffff" fill-opacity="0.06" />

  <!-- Moldura minimalista de cartão / lista de itens -->
  <rect x="116" y="108" width="280" height="296" rx="36" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="14" />

  <!-- Linha 1 da lista -->
  <circle cx="172" cy="186" r="18" fill="#34d399" />
  <rect x="212" y="172" width="136" height="28" rx="14" fill="#ffffff" />

  <!-- Linha 2 da lista -->
  <circle cx="172" cy="256" r="18" fill="#ffffff" fill-opacity="0.9" />
  <rect x="212" y="242" width="112" height="28" rx="14" fill="#ffffff" fill-opacity="0.88" />

  <!-- Linha 3 da lista -->
  <circle cx="172" cy="326" r="18" fill="#ffffff" fill-opacity="0.9" />
  <rect x="212" y="312" width="92" height="28" rx="14" fill="#ffffff" fill-opacity="0.75" />
</svg>
